name: Build Echoes & Departures
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: echoes-mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build
          key: echoes-universal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('EchoesAndDepartures-source.zip') }}-v1
      - name: Unpack source
        run: unzip -q EchoesAndDepartures-source.zip -d source
      - name: Configure universal plugins
        run: cmake -S source/EchoesAndDepartures -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DECHOES_PLUGIN_SMOKE=ON
      - name: Build
        run: cmake --build build --config Release --target EchoesAndDepartures_VST3 EchoesAndDepartures_AU echoes_tests echoes_plugin_smoke echoes_preset_ui_tests --parallel 3
      - uses: actions/cache/save@v4
        with:
          path: build
          key: echoes-universal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('EchoesAndDepartures-source.zip') }}-v1
      - name: Test DSP
        run: ctest --test-dir build --output-on-failure
      - name: Check universal architectures
        run: |
          lipo build/EchoesAndDepartures_artefacts/Release/VST3/EchoesAndDepartures.vst3/Contents/MacOS/EchoesAndDepartures -verify_arch arm64 x86_64
          lipo build/EchoesAndDepartures_artefacts/Release/AU/EchoesAndDepartures.component/Contents/MacOS/EchoesAndDepartures -verify_arch arm64 x86_64
      - name: Load and exercise the actual VST3
        run: |
          mkdir -p dist
          build/echoes_plugin_smoke_artefacts/Release/echoes_plugin_smoke build/EchoesAndDepartures_artefacts/Release/VST3/EchoesAndDepartures.vst3
          build/echoes_preset_ui_tests_artefacts/Release/echoes_preset_ui_tests dist/EchoesAndDepartures-GUI.png
      - name: Sign and package
        run: |
          codesign --force --deep --sign - build/EchoesAndDepartures_artefacts/Release/VST3/EchoesAndDepartures.vst3
          codesign --force --deep --sign - build/EchoesAndDepartures_artefacts/Release/AU/EchoesAndDepartures.component
          codesign --verify --deep --strict build/EchoesAndDepartures_artefacts/Release/VST3/EchoesAndDepartures.vst3
          codesign --verify --deep --strict build/EchoesAndDepartures_artefacts/Release/AU/EchoesAndDepartures.component
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/EchoesAndDepartures_artefacts/Release/VST3/EchoesAndDepartures.vst3 dist/EchoesAndDepartures-VST3.zip
          ditto -c -k --sequesterRsrc --keepParent build/EchoesAndDepartures_artefacts/Release/AU/EchoesAndDepartures.component dist/EchoesAndDepartures-AU.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EchoesAndDepartures-macOS-universal
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        shell: pwsh
        run: Expand-Archive -Path EchoesAndDepartures-source.zip -DestinationPath source
      - name: Configure Windows x64
        run: cmake -S source/EchoesAndDepartures -B build -A x64 -DECHOES_PLUGIN_SMOKE=ON
      - name: Build Windows VST3 and tests
        run: cmake --build build --config Release --target EchoesAndDepartures_VST3 echoes_tests echoes_plugin_smoke echoes_preset_ui_tests --parallel 3
      - name: Test DSP and preset UI
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Load and exercise the Windows VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & build/echoes_plugin_smoke_artefacts/Release/echoes_plugin_smoke.exe build/EchoesAndDepartures_artefacts/Release/VST3/EchoesAndDepartures.vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/echoes_preset_ui_tests_artefacts/Release/echoes_preset_ui_tests.exe dist/EchoesAndDepartures-GUI.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows VST3
        shell: pwsh
        run: Compress-Archive -Path build/EchoesAndDepartures_artefacts/Release/VST3/EchoesAndDepartures.vst3 -DestinationPath dist/EchoesAndDepartures-VST3-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EchoesAndDepartures-Windows-x64
          path: dist/*
          if-no-files-found: error
