name: Build Mac and Windows plugins
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: undertow-mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build
          key: undertow-universal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Undertow-source.zip') }}-v1
      - name: Unpack source
        run: unzip -q Undertow-source.zip -d source
      - name: Configure universal plugins
        run: cmake -S source/Undertow -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DUNDERTOW_PLUGIN_SMOKE=ON
      - name: Build
        run: cmake --build build --config Release --target Undertow_VST3 Undertow_AU undertow_tests undertow_plugin_smoke undertow_preset_ui_tests --parallel 3
      - uses: actions/cache/save@v4
        with:
          path: build
          key: undertow-universal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Undertow-source.zip') }}-v1
      - name: Test DSP
        run: ctest --test-dir build --output-on-failure
      - name: Check universal architectures
        run: |
          lipo build/Undertow_artefacts/Release/VST3/Undertow.vst3/Contents/MacOS/Undertow -verify_arch arm64 x86_64
          lipo build/Undertow_artefacts/Release/AU/Undertow.component/Contents/MacOS/Undertow -verify_arch arm64 x86_64
      - name: Load and exercise the actual VST3
        run: |
          mkdir -p dist
          build/undertow_plugin_smoke_artefacts/Release/undertow_plugin_smoke build/Undertow_artefacts/Release/VST3/Undertow.vst3 dist/Undertow-preview.png
      - name: Sign and package
        run: |
          codesign --force --deep --sign - build/Undertow_artefacts/Release/VST3/Undertow.vst3
          codesign --force --deep --sign - build/Undertow_artefacts/Release/AU/Undertow.component
          codesign --verify --deep --strict build/Undertow_artefacts/Release/VST3/Undertow.vst3
          codesign --verify --deep --strict build/Undertow_artefacts/Release/AU/Undertow.component
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Undertow_artefacts/Release/VST3/Undertow.vst3 dist/Undertow-VST3.zip
          ditto -c -k --sequesterRsrc --keepParent build/Undertow_artefacts/Release/AU/Undertow.component dist/Undertow-AU.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Undertow-macOS-universal
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        shell: pwsh
        run: Expand-Archive -Path Undertow-source.zip -DestinationPath source
      - name: Configure Windows x64
        run: cmake -S source/Undertow -B build -A x64 -DUNDERTOW_PLUGIN_SMOKE=ON
      - name: Build Windows VST3 and tests
        run: cmake --build build --config Release --target Undertow_VST3 undertow_tests undertow_plugin_smoke undertow_preset_ui_tests --parallel 3
      - name: Test DSP and preset UI
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Load and exercise the Windows VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & build/undertow_plugin_smoke_artefacts/Release/undertow_plugin_smoke.exe build/Undertow_artefacts/Release/VST3/Undertow.vst3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows VST3
        shell: pwsh
        run: Compress-Archive -Path build/Undertow_artefacts/Release/VST3/Undertow.vst3 -DestinationPath dist/Undertow-VST3-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Undertow-Windows-x64
          path: dist/Undertow-VST3-Windows.zip
          if-no-files-found: error
